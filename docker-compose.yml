services:
  postgres:
    image: postgres:14
    profiles:
      - infra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - ${DB_HOAST_PORT}:${DB_PORT}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    profiles:
      - infra
    ports:
      - ${CACHE_HOAST_PORT}:${CACHE_PORT}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend

  web:
    build: .
    profiles:
      - app
    command: bash -lc 'ruby -rsocket -e "loop { begin; TCPSocket.new(\"postgres\", ${DB_PORT}).close; break; rescue; sleep 1; end }" && bundle exec rails assets:precompile && bundle exec rails db:prepare && bundle exec rails server -e production -b 0.0.0.0'
    volumes:
      - ./:/ror
    ports:
      - "${RAILS_HOAST_PORT}:3000"
    environment:
      - ENV=PROD
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DB_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - REDIS_URL=${REDIS_URL}
      - RAILS_SERVE_STATIC_FILES=true
      - WALLTAKER_BASE_URL=${WALLTAKER_URL}
      - WALLTAKER_HOST=${WALLTAKER_HOST}
    networks:
      - backend
      - frontend

  pornbot_scheduler:
    build: .
    profiles:
      - app
    command: bash -lc 'ruby -rsocket -e "loop { begin; TCPSocket.new(\"database\", ${DB_PORT}).close; break; rescue; sleep 1; end }" && while true; do bundle exec rake walltaker:porn_bot_round; sleep "$${PORNBOT_INTERVAL_SECONDS:-600}"; done'
    volumes:
      - ./:/ror
    environment:
      - POSTGRES_USER=${DB_USER}
      - DATABASE_URL=${DB_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - REDIS_URL=${REDIS_URL}
      - RAILS_ENV=production
      - PORNBOT_INTERVAL_SECONDS=600
      - WALLTAKER_BASE_URL=${WALLTAKER_URL}
      - WALLTAKER_HOST=${WALLTAKER_HOST}
    networks:
    - backend

volumes:
  postgres-data:

networks:
  backend:
  frontend:

