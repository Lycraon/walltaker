version: "3"
services:
  database:
    image: postgres:14
    volumes:
      - postgres-data:/var/lib/postgresql/data
    #ports:
    #  - ${DB_PORT}:${DB_PORT}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - backend

  cache:
    image: redis:7-alpine
    networks:
      - backend

  web:
    build: .
    volumes:
      - ./:/ror
    ports:
      - "3000:3000"
    depends_on:
      - database
      - cache
    environment:
      - ENV=PROD
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=${DB_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - REDIS_URL=${REDIS_URL}
      - RAILS_SERVE_STATIC_FILES=true
      - WALLTAKER_BASE_URL=${WALLTAKER_URL}
      - WALLTAKER_HOST=${WALLTAKER_HOST}
    networks:
      - backend
      - frontend

  pornbot_scheduler:
    build: .
    command: bash -lc 'ruby -rsocket -e "loop { begin; TCPSocket.new(\"database\", ${DB_PORT}).close; break; rescue; sleep 1; end }" && while true; do bundle exec rake walltaker:porn_bot_round; sleep "$${PORNBOT_INTERVAL_SECONDS:-600}"; done'
    volumes:
      - ./:/ror
    depends_on:
      - database
      - cache
    environment:
      - POSTGRES_USER=${DB_USER}
      - DATABASE_URL=${DB_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - REDIS_URL=redis://redis:${CACHE_PORT}/1
      - RAILS_ENV=production
      - PORNBOT_INTERVAL_SECONDS=600
      - WALLTAKER_BASE_URL=${WALLTAKER_URL}
      - WALLTAKER_HOST=${WALLTAKER_HOST}
    networks:
    - backend

volumes:
  postgres-data:

networks:
  backend:
#   drive: bridge
  frontend:
#   driver: bridge

